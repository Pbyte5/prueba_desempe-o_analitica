name: datamart

x-airflow-common: &airflow-common
  build:
    context: .
    args:
      AIRFLOW_VERSION: ${AIRFLOW_VERSION:-3.3.2}
  image: datamart-airflow:${AIRFLOW_VERSION:-3.3.2}
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    # --- Core ---
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"   # The dag run only when it starts
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"       
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres-airflow:5432/${AIRFLOW_DB_NAME}

    # --- Auth (Simple Auth Manager) ---
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_ADMIN_USER}:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_passwords.json
    # --- Airflow Connection ( AIRFLOW_CONN_<CONN_ID>) ---
    AIRFLOW_CONN_DATAMART: postgresql://${DW_USER}:${DW_PASSWORD}@postgres-dw:5432/${DW_DB}
    # --- Airflow Variables (AIRFLOW_VAR_<KEY>) ---
    AIRFLOW_VAR_DATAMART_HISTORY_FILES: ${DATAMART_HISTORY_FILE:-raw/online_retail_II.csv}
    AIRFLOW_VAR_DATAMART_DAILY_FILES: ${DATAMART_DAILY_FILE:-raw/data.csv}
    AIRFLOW_VAR_DATAMART_SOURCE_PRIORITY: ${DATAMART_SOURCE_PRIORITY:-history,daily}
    AIRFLOW_VAR_DATAMART_SOURCE_TZ: ${DATAMART_SOURCE_TZ:-Europe/London}
    AIRFLOW_VAR_DATAMART_PRODUCTS_API_URL: ${DATAMART_PRODUCTS_API_URL-http://products-api:8000}
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./seeds:/opt/airflow/seeds:ro
    - ./data:/opt/airflow/data:ro
    - airflow-logs:/opt/airflow/logs
    - airflow-staging:/opt/airflow/staging
  depends_on: &airflow-depends-on
    postgres-airflow:
      condition: service_healthy
    postgres-dw:
      condition: service_healthy
    products-api:
      condition: service_healthy

services:
  # Airflow Metadata
  postgres-airflow:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
    volumes:
      - airflow-meta-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER} -d ${AIRFLOW_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Analytic repository. The tables are created when it starts.
  postgres-dw:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DW_USER}
      POSTGRES_PASSWORD: ${DW_PASSWORD}
      POSTGRES_DB: ${DW_DB}
    ports:
      - "${DW_HOST_PORT:-5433}:5432"
    volumes:
      - dw-data:/var/lib/postgresql/data
      - ./sql/ddl/ddl.sql:/docker-entrypoint-initdb.d/01-ddl.sql:ro
      - ./sql/queries:/queries:ro          # querys with  psql -f /queries/...
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DW_USER} -d ${DW_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  products-api:
    build:
      context: .
      dockerfile: src/prueba_analitica/api/Dockerfile
    environment:
      DW_HOST: postgres-dw
      DW_PORT: 5432
      DW_USER: ${DW_USER}
      DW_PASSWORD: ${DW_PASSWORD}
      DW_DB: ${DW_DB}
    ports:
      - "${PRODUCTS_API_HOST_PORT:-8000}:8000"
    depends_on:
      postgres-dw:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Database migrations
  airflow-init:
    <<: *airflow-common
    command: ["db", "migrate"]
    depends_on: *airflow-depends-on

  airflow-apiserver:
    <<: *airflow-common
    entrypoint: ["/bin/bash", "-c"]
    # Created user's credentials base on .env
   
    command:
      - |
        printf '{"%s": "%s"}' "$$AIRFLOW_ADMIN_USER" "$$AIRFLOW_ADMIN_PASSWORD" > /opt/airflow/simple_auth_passwords.json
        exec /entrypoint airflow api-server
    environment:
      <<: *airflow-env
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: ["scheduler"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_healthy
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: ["dag-processor"]
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  airflow-meta-data:
  airflow-logs:
  airflow-staging:
  dw-data:
