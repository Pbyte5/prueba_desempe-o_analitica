[project]
name = "prueba-analitica"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lians", email = "paterninalopezlians@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "apache-airflow-providers-postgres>=7.0.2",
    "numpy",
    "pandas",
]

[dependency-groups]
api = [
    "fastapi>=0.136.3",
    "psycopg[binary]>=3.3.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
prueba-analitica = "prueba_analitica:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
